# Confere se o backend chegou em produção.
#
# Quem sobe o servidor é o webhook do Coolify, em todo push de main. Este workflow
# não dispara nada e não precisa de secret: só espera o commit aparecer no
# /api/health. Fica vermelho apenas quando o deploy não entra de verdade.
#
# Existe por causa de 2026-08-07: semanas de merges não chegaram à produção e
# ninguém percebeu. Um build verde com container morto em boot deixa o código
# antigo servindo, e só esta pergunta pega esse caso.
#
# Se ficar vermelho: abrir o log do último deployment no painel do Coolify.

name: Verify backend deploy

on:
  workflow_run:
    workflows: ['Test Suite']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit a verificar no ar (vazio = HEAD de main)'
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Commit no ar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Com testes vermelhos em main o resultado não diz nada sobre o deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'main' }}
          # A checagem precisa do histórico para reconhecer um commit mais novo no ar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: O commit está mesmo no ar?
        run: |
          node server/scripts/check-deploy-drift.mjs \
            --ref "$(git rev-parse HEAD)" \
            --aguardar 1200
